name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - 3.11.0
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install dependencies
        run: dart pub get --enforce-lockfile
      - name: Bootstrap workspace
        run: dart run melos bootstrap --enforce-lockfile
      - name: Generate sources
        run: dart run melos run codegen
      - name: Verify pinned schema generation
        run: dart run melos run schema:check
      - name: Verify pinned live specification mapping
        run: dart run melos run spec:check
      - name: Verify pinned behavioral test mapping
        run: dart run melos run reference:check
      - name: Verify generated sources are committed
        shell: bash
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            echo "Untracked generated files:"
            echo "$untracked"
            exit 1
          fi
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed tool test
          dart run melos run format
      - name: Analyze
        run: |
          dart analyze --fatal-infos tool test
          dart run melos run analyze
      - name: Test repository tools
        run: dart test test
      - name: Test packages
        run: dart run melos run test
      - name: Smoke examples
        if: matrix.sdk == 'stable'
        run: dart run melos run examples:smoke
      - name: Compile public libraries for web
        if: matrix.sdk == 'stable'
        run: dart run tool/check_web_compile.dart
      - name: Test packages in Chrome
        if: matrix.sdk == 'stable'
        run: dart run melos run test:web
      - name: Report file-size guidance
        run: dart run tool/check_file_sizes.dart
      - name: Check release hygiene
        run: dart run tool/check_release_hygiene.dart
      - name: Measure coverage
        if: matrix.sdk == 'stable'
        run: |
          dart run melos run coverage:vm
          dart run melos run coverage:web
          dart run melos run coverage:merge
      - name: Enforce coverage
        if: matrix.sdk == 'stable'
        run: dart run tool/check_coverage.dart packages/dart_acp_sdk/coverage/lcov.info
      - name: Upload merged coverage
        if: matrix.sdk == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: dart-acp-sdk-coverage
          path: packages/dart_acp_sdk/coverage/lcov.info
      - name: Benchmark smoke
        if: matrix.sdk == 'stable'
        run: dart run melos run benchmarks:smoke
      - name: Publish dry run for all packages
        if: matrix.sdk == 'stable'
        run: dart run melos run publish:dry-run
